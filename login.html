<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Marian Nicole</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--beige) 100%);
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header img {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            color: var(--dark-brown);
            margin: 0;
        }

        .login-header p {
            color: var(--light-text);
            margin: 0.5rem 0 0 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark-text);
        }

        input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--accent-pink);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.1);
        }

        .login-btn {
            width: 100%;
            background-color: var(--brown);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: var(--primary-pink);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 115, 85, 0.2);
        }

        .error {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--brown);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            color: var(--primary-pink);
        }

        .floating-capybara {
            position: fixed;
            width: 25px;
            height: 25px;
            pointer-events: none;
            z-index: 999;
            transition: transform 0.05s ease-out;
        }

        .capy-cursor-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(139, 115, 85, 0.3));
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="assets/capy1.png" alt="Capybara">
            <h1>Admin Access</h1>
            <p>Manage your portfolio</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
                <div class="error" id="error">Incorrect password. Try again.</div>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="back-link">
            <a href="index.html">Back to Portfolio</a>
        </div>
    </div>

    <div class="floating-capybara">
        <img src="assets/capy1.png" alt="Capybara Cursor" class="capy-cursor-img">
    </div>

    <script src="js/main.js"></script>
    <script>
        // Admin password - Change this to your own!
        const ADMIN_PASSWORD = 'aria2025';

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;

            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
