<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Marian Nicole</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--accent-pink);
            overflow-x: auto;
        }

        .tab-button {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            color: var(--light-text);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .tab-button.active {
            color: var(--primary-pink);
            border-bottom-color: var(--primary-pink);
        }

        .tab-button:hover {
            color: var(--brown);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .admin-section {
            background: white;
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark-text);
        }

        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--accent-pink);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.1);
        }

        .btn {
            background-color: var(--brown);
            color: white;
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--primary-pink);
            transform: translateY(-2px);
        }

        .item {
            background: var(--light-pink);
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 10px;
            border-left: 4px solid var(--primary-pink);
        }

        .item h3 {
            margin: 0 0 0.5rem 0;
            color: var(--dark-brown);
        }

        .delete-btn {
            background-color: #d32f2f;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .delete-btn:hover {
            background-color: #b71c1c;
        }

        h2 {
            color: var(--dark-brown);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .skill-input {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .skill-input input {
            flex: 1;
        }

        .skill-input button {
            padding: 0.5rem 1rem;
            background-color: #d32f2f;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .admin-container {
                padding: 1.5rem;
            }

            .tabs {
                gap: 0.5rem;
                overflow-x: auto;
                scroll-behavior: smooth;
            }

            .tab-button {
                padding: 0.8rem 1rem;
                font-size: 0.75rem;
                white-space: nowrap;
                border-radius: 5px;
            }

            .admin-section {
                padding: 1.5rem;
                margin: 1.5rem 0;
            }

            h2 {
                font-size: 1.3rem;
                margin-bottom: 1rem;
            }

            input, textarea, select {
                font-size: 16px !important;
                padding: 0.7rem !important;
            }

            .btn {
                width: 100%;
                padding: 0.9rem;
                font-size: 0.95rem;
            }

            .item {
                padding: 1.2rem;
                margin: 0.8rem 0;
            }

            .delete-btn {
                width: 100%;
                padding: 0.6rem;
                font-size: 0.85rem;
            }

            label {
                font-size: 0.9rem;
                margin-bottom: 0.4rem;
            }

            .form-group {
                margin-bottom: 1.2rem;
            }

            .skill-input {
                flex-direction: column;
                gap: 0.5rem;
            }

            .skill-input input {
                width: 100%;
            }

            .skill-input button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .admin-container {
                padding: 1rem;
            }

            .tabs {
                gap: 0.3rem;
                margin-bottom: 1.5rem;
            }

            .tab-button {
                padding: 0.6rem 0.8rem;
                font-size: 0.65rem;
                border-radius: 4px;
            }

            .admin-section {
                padding: 1rem;
                margin: 1rem 0;
                border-radius: 10px;
            }

            h2 {
                font-size: 1.1rem;
                margin-bottom: 0.8rem;
            }

            input, textarea, select {
                font-size: 16px !important;
                padding: 0.6rem !important;
                border-radius: 6px;
            }

            .btn {
                width: 100%;
                padding: 0.8rem;
                font-size: 0.9rem;
                border-radius: 20px;
            }

            .item {
                padding: 1rem;
                margin: 0.6rem 0;
                border-radius: 8px;
            }

            .item h3 {
                font-size: 1rem;
            }

            .item p {
                font-size: 0.9rem;
            }

            .delete-btn {
                width: 100%;
                padding: 0.5rem;
                font-size: 0.8rem;
            }

            label {
                font-size: 0.85rem;
                margin-bottom: 0.3rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            textarea {
                resize: vertical;
                min-height: 100px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><img src="assets/capy1.png" alt="Capybara" class="logo-img"> Admin Dashboard</div>
            <ul class="nav-links">
                <li><a href="index.html">Back to Portfolio</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('about')">About</button>
            <button class="tab-button" onclick="switchTab('skills')">Skills</button>
            <button class="tab-button" onclick="switchTab('projects')">Projects</button>
            <button class="tab-button" onclick="switchTab('experience')">Experience</button>
            <button class="tab-button" onclick="switchTab('links')">Links</button>
        </div>

        <!-- About Tab -->
        <div id="about" class="tab-content active">
            <div class="admin-section">
                <h2>Edit About Me</h2>
                <form id="aboutForm">
                    <div class="form-group">
                        <label for="aboutText">About Me Description</label>
                        <textarea id="aboutText" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn">Save About Me</button>
                </form>
            </div>
            <div class="admin-section">
                <h2>Current About Me</h2>
                <div id="aboutDisplay"></div>
            </div>
        </div>

        <!-- Skills Tab -->
        <div id="skills" class="tab-content">
            <div class="admin-section">
                <h2>Add Skill</h2>
                <form id="skillForm">
                    <div class="form-group">
                        <label for="skillCategory">Category</label>
                        <input type="text" id="skillCategory" placeholder="e.g., Frontend & Web" required>
                    </div>
                    <div class="form-group">
                        <label for="skillName">Skill Name</label>
                        <input type="text" id="skillName" placeholder="e.g., JavaScript" required>
                    </div>
                    <button type="submit" class="btn">Add Skill</button>
                </form>
            </div>

            <div class="admin-section">
                <h2>Your Skills</h2>
                <div id="skillsList"></div>
            </div>
        </div>

        <!-- Projects Tab -->
        <div id="projects" class="tab-content">
            <div class="admin-section">
                <h2>Add New Project</h2>
                <form id="projectForm">
                    <div class="form-group">
                        <label for="title">Project Title</label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g., Responsive Website, Mobile App">
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="text" id="year" placeholder="e.g., 2025">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="tags">Tags (comma-separated)</label>
                        <input type="text" id="tags" placeholder="e.g., HTML, CSS, JavaScript">
                    </div>

                    <button type="submit" class="btn">Add Project</button>
                </form>
            </div>

            <div class="admin-section">
                <h2>Your Projects</h2>
                <div id="projectList"></div>
            </div>
        </div>

        <!-- Experience Tab -->
        <div id="experience" class="tab-content">
            <div class="admin-section">
                <h2>Add Experience or Work</h2>
                <form id="experienceForm">
                    <div class="form-group">
                        <label for="expType">Type</label>
                        <select id="expType" required>
                            <option value="Work Experience">Work Experience</option>
                            <option value="Education">Education</option>
                            <option value="Certification">Certification</option>
                            <option value="Award">Award</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expTitle">Title / Position</label>
                        <input type="text" id="expTitle" placeholder="e.g., Software Developer, Bachelor's Degree" required>
                    </div>

                    <div class="form-group">
                        <label for="expOrganization">Organization / Company / School</label>
                        <input type="text" id="expOrganization" required>
                    </div>

                    <div class="form-group">
                        <label for="expPeriod">Period (e.g., 2024 - Present)</label>
                        <input type="text" id="expPeriod" placeholder="e.g., Jan 2024 - Present">
                    </div>

                    <div class="form-group">
                        <label for="expDescription">Description</label>
                        <textarea id="expDescription" rows="3" placeholder="Brief description of your role or achievement"></textarea>
                    </div>

                    <button type="submit" class="btn">Add Experience</button>
                </form>
            </div>

            <div class="admin-section">
                <h2>Your Experience & Works</h2>
                <div id="experienceList"></div>
            </div>
        </div>

        <!-- Links Tab -->
        <div id="links" class="tab-content">
            <div class="admin-section">
                <h2>Add or Edit Links</h2>
                <form id="linkForm">
                    <div class="form-group">
                        <label for="linkLabel">Label (e.g., Instagram, Portfolio, GitHub)</label>
                        <input type="text" id="linkLabel" placeholder="e.g., Instagram, Twitter, Portfolio" required>
                    </div>

                    <div class="form-group">
                        <label for="linkURL">URL</label>
                        <input type="url" id="linkURL" placeholder="https://..." required>
                    </div>

                    <button type="submit" class="btn">Add Link</button>
                </form>
            </div>

            <div class="admin-section">
                <h2>Your Links & Social Profiles</h2>
                <div id="linkList"></div>
            </div>
        </div>
    </div>

    <div class="floating-capybara">
        <img src="assets/capy1.png" alt="Capybara Cursor" class="capy-cursor-img">
    </div>

    <script src="js/main.js"></script>
    <script>
        if (!sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'login.html';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // ===== ABOUT ME =====
        function loadAbout() {
            const about = localStorage.getItem('userAbout') || '';
            document.getElementById('aboutText').value = about;
            document.getElementById('aboutDisplay').innerHTML = about ? `<p>${about.replace(/\n/g, '<br>')}</p>` : '<p style="color: var(--light-text);">No about me added yet.</p>';
        }

        document.getElementById('aboutForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const about = document.getElementById('aboutText').value;
            localStorage.setItem('userAbout', about);
            loadAbout();
            alert('About Me updated!');
        });

        // ===== SKILLS =====
        function loadSkills() {
            const skills = JSON.parse(localStorage.getItem('userSkills') || '[]');
            const skillsList = document.getElementById('skillsList');

            if (skills.length === 0) {
                skillsList.innerHTML = '<p style="color: var(--light-text);">No skills added yet.</p>';
                return;
            }

            const grouped = {};
            skills.forEach(skill => {
                if (!grouped[skill.category]) grouped[skill.category] = [];
                grouped[skill.category].push(skill);
            });

            skillsList.innerHTML = Object.entries(grouped).map(([category, categorySkills]) => `
                <div class="item">
                    <h3>${category}</h3>
                    ${categorySkills.map((skill, idx) => `
                        <div style="display: inline-block; margin-right: 1rem; margin-bottom: 0.5rem;">
                            ${skill.name}
                            <button class="delete-btn" onclick="deleteSkill('${category}', '${skill.name}')" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; margin: 0;">✕</button>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function deleteSkill(category, name) {
            if (confirm('Delete this skill?')) {
                let skills = JSON.parse(localStorage.getItem('userSkills') || '[]');
                skills = skills.filter(s => !(s.category === category && s.name === name));
                localStorage.setItem('userSkills', JSON.stringify(skills));
                loadSkills();
            }
        }

        document.getElementById('skillForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const skill = {
                category: document.getElementById('skillCategory').value,
                name: document.getElementById('skillName').value
            };

            const skills = JSON.parse(localStorage.getItem('userSkills') || '[]');
            skills.push(skill);
            localStorage.setItem('userSkills', JSON.stringify(skills));

            document.getElementById('skillForm').reset();
            loadSkills();
            alert('Skill added!');
        });

        // ===== PROJECTS =====
        function loadProjects() {
            const projects = JSON.parse(localStorage.getItem('userProjects') || '[]');
            const projectList = document.getElementById('projectList');

            if (projects.length === 0) {
                projectList.innerHTML = '<p style="color: var(--light-text);">No projects added yet.</p>';
                return;
            }

            projectList.innerHTML = projects.map((project, index) => `
                <div class="item">
                    <h3>${project.title}</h3>
                    <p><strong>${project.category}</strong> | ${project.year}</p>
                    <p>${project.description}</p>
                    <p><small>Tags: ${project.tags}</small></p>
                    <button class="btn delete-btn" onclick="deleteProject(${index})">Delete</button>
                </div>
            `).join('');
        }

        function deleteProject(index) {
            if (confirm('Delete this project?')) {
                const projects = JSON.parse(localStorage.getItem('userProjects') || '[]');
                projects.splice(index, 1);
                localStorage.setItem('userProjects', JSON.stringify(projects));
                loadProjects();
            }
        }

        document.getElementById('projectForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const project = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                year: document.getElementById('year').value,
                description: document.getElementById('description').value,
                tags: document.getElementById('tags').value
            };

            const projects = JSON.parse(localStorage.getItem('userProjects') || '[]');
            projects.push(project);
            localStorage.setItem('userProjects', JSON.stringify(projects));

            document.getElementById('projectForm').reset();
            loadProjects();
            alert('Project added!');
        });

        // ===== EXPERIENCE =====
        function loadExperiences() {
            const experiences = JSON.parse(localStorage.getItem('userExperiences') || '[]');
            const experienceList = document.getElementById('experienceList');

            if (experiences.length === 0) {
                experienceList.innerHTML = '<p style="color: var(--light-text);">No experiences added yet.</p>';
                return;
            }

            experienceList.innerHTML = experiences.map((exp, index) => `
                <div class="item">
                    <h3>${exp.expTitle}</h3>
                    <p><strong>${exp.expType}</strong> at ${exp.expOrganization}</p>
                    <p><small>${exp.expPeriod}</small></p>
                    ${exp.expDescription ? `<p>${exp.expDescription}</p>` : ''}
                    <button class="btn delete-btn" onclick="deleteExperience(${index})">Delete</button>
                </div>
            `).join('');
        }

        function deleteExperience(index) {
            if (confirm('Delete this experience?')) {
                const experiences = JSON.parse(localStorage.getItem('userExperiences') || '[]');
                experiences.splice(index, 1);
                localStorage.setItem('userExperiences', JSON.stringify(experiences));
                loadExperiences();
            }
        }

        document.getElementById('experienceForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const experience = {
                expType: document.getElementById('expType').value,
                expTitle: document.getElementById('expTitle').value,
                expOrganization: document.getElementById('expOrganization').value,
                expPeriod: document.getElementById('expPeriod').value,
                expDescription: document.getElementById('expDescription').value
            };

            const experiences = JSON.parse(localStorage.getItem('userExperiences') || '[]');
            experiences.push(experience);
            localStorage.setItem('userExperiences', JSON.stringify(experiences));

            document.getElementById('experienceForm').reset();
            loadExperiences();
            alert('Experience added!');
        });

        // ===== LINKS =====
        function loadLinks() {
            const links = JSON.parse(localStorage.getItem('userLinks') || '[]');
            const linkList = document.getElementById('linkList');

            if (links.length === 0) {
                linkList.innerHTML = '<p style="color: var(--light-text);">No custom links added yet.</p>';
                return;
            }

            linkList.innerHTML = links.map((link, index) => `
                <div class="item">
                    <h3>${link.linkLabel}</h3>
                    <p><a href="${link.linkURL}" target="_blank" style="color: var(--primary-pink); text-decoration: underline;">${link.linkURL}</a></p>
                    <button class="btn delete-btn" onclick="deleteLink(${index})">Delete</button>
                </div>
            `).join('');
        }

        function deleteLink(index) {
            if (confirm('Delete this link?')) {
                const links = JSON.parse(localStorage.getItem('userLinks') || '[]');
                links.splice(index, 1);
                localStorage.setItem('userLinks', JSON.stringify(links));
                loadLinks();
            }
        }

        document.getElementById('linkForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const link = {
                linkLabel: document.getElementById('linkLabel').value,
                linkURL: document.getElementById('linkURL').value
            };

            const links = JSON.parse(localStorage.getItem('userLinks') || '[]');
            links.push(link);
            localStorage.setItem('userLinks', JSON.stringify(links));

            document.getElementById('linkForm').reset();
            loadLinks();
            alert('Link added!');
        });

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }

        function initializeDefaults() {
            if (!localStorage.getItem('userProjects')) {
                const defaultProjects = [
                    {
                        title: 'KAIA',
                        category: 'Responsive Website',
                        year: '2025',
                        description: 'An NGO discovery and volunteer platform bringing scattered Filipino organizations into one verified ecosystem. Features verified profiles, multi-step donations, QR check-in for volunteers, and financial transparency.',
                        tags: 'Responsive Design, Web'
                    },
                    {
                        title: 'LakbAI',
                        category: 'Systems Analysis & Design',
                        year: '2025',
                        description: 'A commuter information system concept combining real-time traffic, CCTV feeds, and crowdsourced reports with accessibility features for seniors and people with disabilities.',
                        tags: 'Systems Analysis, Design'
                    },
                    {
                        title: 'Sassy Station',
                        category: 'HTML, CSS, JavaScript',
                        year: '2025',
                        description: 'An online booking website for a nail salon in Bauang, La Union, allowing clients to browse services and schedule appointments seamlessly.',
                        tags: 'HTML, CSS, JavaScript'
                    }
                ];
                localStorage.setItem('userProjects', JSON.stringify(defaultProjects));
            }

            if (!localStorage.getItem('userSkills')) {
                const defaultSkills = [
                    { category: 'Frontend & Web', name: 'HTML5' },
                    { category: 'Frontend & Web', name: 'CSS3' },
                    { category: 'Frontend & Web', name: 'JavaScript' },
                    { category: 'Frontend & Web', name: 'Responsive Design' },
                    { category: 'Frontend & Web', name: 'UI/UX Wireframing' },
                    { category: 'Data & Backend', name: 'SQL' },
                    { category: 'Data & Backend', name: 'MySQL' },
                    { category: 'Data & Backend', name: 'Python' },
                    { category: 'Data & Backend', name: 'PHP' },
                    { category: 'Data & Backend', name: 'Data Analysis' },
                    { category: 'Tools & Systems', name: 'Git & GitHub' },
                    { category: 'Tools & Systems', name: 'VSCode' },
                    { category: 'Tools & Systems', name: 'Figma' },
                    { category: 'Tools & Systems', name: 'Systems Analysis' },
                    { category: 'Tools & Systems', name: 'CCNA Certified' },
                    { category: 'Interests', name: 'Cloud Computing' },
                    { category: 'Interests', name: 'AI & LLMs' },
                    { category: 'Interests', name: 'Cybersecurity' },
                    { category: 'Interests', name: 'Data Science' },
                    { category: 'Interests', name: 'Enterprise Data Mgmt' }
                ];
                localStorage.setItem('userSkills', JSON.stringify(defaultSkills));
            }
        }

        // Load on page load
        initializeDefaults();
        loadAbout();
        loadSkills();
        loadProjects();
        loadExperiences();
        loadLinks();
    </script>
</body>
</html>
